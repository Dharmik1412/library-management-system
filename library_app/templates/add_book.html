{% extends 'base.html' %}
{% block content %}
<h3 class="text-dark">Add Book</h3>
<form method="POST">{% csrf_token %}
  <div class="mb-3"><label>Title</label><input name="title" class="form-control" required></div>
  <div class="mb-3"><label>Author</label><input name="author" class="form-control" required></div>
  <div class="mb-3"><label>ISBN</label><input name="isbn" class="form-control" required></div>
  <div class="mb-3"><label>Quantity</label><input name="quantity" type="number" class="form-control" required></div>
  <button class="btn btn-dark">Add</button>
</form>
{% endblock %}
