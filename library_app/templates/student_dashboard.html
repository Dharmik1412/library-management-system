<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-info">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Student Portal</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link text-danger" href="/logout/">Logout</a></li>
    </ul>
  </div>
</nav>

<div class="container mt-4">
  <h2>Welcome, {{ student_username }} </h2>
  <p class="text-muted">Here are the available books:</p>

  <table class="table table-bordered">
    <thead class="bg-info"><tr><th>Title</th><th>Author</th><th>ISBN</th></tr></thead>
    <tbody>
      {% for b in books %}
      <tr><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.isbn }}</td></tr>
      {% empty %}
      <tr><td colspan="3">No books available</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
