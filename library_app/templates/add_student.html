{% extends 'base.html' %}
{% block content %}
<h3 class="text-dark">Add Student</h3>
<form method="POST">{% csrf_token %}
  <div class="mb-3"><label>Username</label><input name="username" class="form-control" required></div>
  <div class="mb-3"><label>Password</label><input name="password" class="form-control" required></div>
  <div class="mb-3"><label>Enrollment</label><input name="enrollment" class="form-control" required></div>
  <div class="mb-3"><label>Branch</label><input name="branch" class="form-control" required></div>
  <button class="btn btn-dark">Add Student</button>
</form>
{% endblock %}
