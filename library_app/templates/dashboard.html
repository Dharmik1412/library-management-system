{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Dashboard</h3>
<p>Welcome! Here you can see available books.</p>

<table class="table table-bordered mt-4">
  <thead class="table-info">
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Category</th>
      <th>Available</th>
    </tr>
  </thead>
  <tbody>
    {% for book in books %}
    <tr>
      <td>{{ book.title }}</td>
      <td>{{ book.author }}</td>
      <td>{{ book.category }}</td>
      <td>{{ book.available }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="text-center">No books added yet</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
